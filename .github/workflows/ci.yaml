name: CI Pipeline

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2 # v4.1.0

      - name: Configure correct Go version
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5  # v5.5.0 # v4.1.0
        with:
          go-version-file: go.mod

      # Check formatting early for a fast fail
      - run: bash -c "diff -bu <(echo -n) <(gofmt -l ./)"

      - run: go build .

      - uses: dominikh/staticcheck-action@ba605356b4b29a60e87ab9404b712f3461e566dc # v1.3.0
        with:
          install-go: false

      - run: go vet ./...

      - name: Run Tests
        run: |
          go install gotest.tools/gotestsum@latest
          gotestsum --jsonfile gotestsum-report.json -- -race ./...
      
      - name: Annotate tests
        if: always()
        uses: guyarb/golang-test-annotations@2941118d7ef622b1b3771d1ff6eae9e90659eb26  # v0.8.0 # v0.7.0
        with:
          test-results: gotestsum-report.json